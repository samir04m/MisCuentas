{% extends 'base/base.html' %}

{% block title %}Login{% endblock %}

{% block contenido %}

    <div class="container">
        <div class="row p-t-20">
            <div class="col-sm-12 offset-md-3 col-md-5">
                <div class="card animate__animated animate__fadeInDown">
                    <div class="card-body">
                        <h5 class="text-center mb-3">Login</h5>
                        {% if form.non_field_errors %}
                        <div class="alert alert-danger alert-dismissible" role="alert">
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                            <strong>Error: </strong> {{ form.non_field_errors }}
                        </div>
                        {% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="" autocapitalize="none" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="" required>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-primary mt-3 px-4" data-loading>Login</button>
                            </div>
                        </form>

                    </div>

                </div>
                <!-- <div class="text-center fs-16 text-white mt-5 animate__animated animate__fadeInUp">
                    Aun no tienes cuenta? <b><a href="{% url 'user:registro' %}" class="text-white" data-loading>Ir al Registro</a></b>
                </div> -->
            </div>

        </div>
    </div>


{% endblock %}
